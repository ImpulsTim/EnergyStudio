<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekenkern — tests</title>
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:#f5f8f6;color:#242b38}
  header{background:#242b38;color:#fff;padding:16px 24px}
  header h1{margin:0;font-size:18px}
  #sum{padding:12px 24px;font-size:15px;font-weight:700}
  #sum.ok{color:#2e7d32}#sum.bad{color:#c0392b}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 24px;border-bottom:1px solid #e2ecdf}
  th{background:#eef2ec;font-size:11px;text-transform:uppercase;color:#666}
  tr.pass td:first-child{color:#2e7d32;font-weight:700}
  tr.fail{background:#fdecea}
  tr.fail td:first-child{color:#c0392b;font-weight:700}
  td.msg{color:#888;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<header><h1>Rekenkern — testsuite</h1></header>
<div id="sum">Bezig…</div>
<table><thead><tr><th style="width:60px">Status</th><th>Test</th><th>Detail</th></tr></thead>
<tbody id="rows"></tbody></table>

<!-- Zelfde laadvolgorde als de app: globals (tarieven) vóór de rekenkern -->
<script src="tarieven.js"></script>
<script src="rekenkern.js"></script>
<script>
(function(){
  var results=[];
  function rec(name,ok,msg){results.push({name:name,ok:ok,msg:msg||''});}
  function test(name,fn){try{fn();rec(name,true,'');}catch(e){rec(name,false,e&&e.message||String(e));}}
  function close(a,b,tol){return Math.abs(a-b)<=(tol==null?1e-6:tol);}
  function assert(c,m){if(!c)throw new Error(m||'assertie faalde');}
  function eq(a,b,m,tol){if(!close(a,b,tol))throw new Error((m||'')+' verwacht '+b+' kreeg '+a);}

  // --- splitQuarter ----------------------------------------------------------
  test('splitQuarter: afname / teruglever / nul',function(){
    var a=splitQuarter(100); eq(a.afnameKwh,25,'afname'); eq(a.terugleverKwh,0,'teruglever');
    var b=splitQuarter(-40); eq(b.afnameKwh,0); eq(b.terugleverKwh,10);
    var c=splitQuarter(0); eq(c.afnameKwh,0); eq(c.terugleverKwh,0);
  });

  // --- energiebelasting ------------------------------------------------------
  test('calculateEnergyTax: enkele schijf',function(){
    var r=calculateEnergyTax(5000,0,{}); eq(r.netto,5000*0.1228,'schijf1');
  });
  test('calculateEnergyTax: schijf-overgang',function(){
    var r=calculateEnergyTax(20000,0,{}); eq(r.netto,10000*0.1228+10000*0.1048,'twee schijven');
  });
  test('calculateEnergyTax: saldering over netto-afname',function(){
    var r=calculateEnergyTax(10000,4000,{saldering:true}); eq(r.grondslagKwh,6000); eq(r.netto,6000*0.1228);
  });
  test('calculateEnergyTax: heffingskorting',function(){
    var r=calculateEnergyTax(5000,0,{heffingskorting:100}); eq(r.netto,5000*0.1228-100);
  });

  // --- netkosten = referentie (drawKosten-logica) ----------------------------
  test('calculateGridCosts: gelijk aan kosten.js-referentie',function(){
    var comp={stedinA:'LS',stedinT:'LS',gtvA:50};
    var data=[
      {ts:'2024-01-02T09:00',kw:80},  // werkdag normaal
      {ts:'2024-01-02T09:15',kw:120},
      {ts:'2024-01-06T09:00',kw:60},  // zaterdag -> dal
      {ts:'2024-02-02T09:00',kw:200}  // andere maand
    ];
    var g=calculateGridCosts(comp,data,{});
    // Referentie exact volgens charts/kosten.js
    var sa=SA.LS,st=ST.LS;
    var mndSet={},mPA={},dn=0,dl=0;
    data.forEach(function(d){var mn=d.ts.slice(0,7);mndSet[mn]=1;var af=Math.max(0,d.kw);
      if(!mPA[mn]||af>mPA[mn])mPA[mn]=af;var kwh=af*0.25;if(isDL(d.ts))dl+=kwh;else dn+=kwh;});
    var nMnd=Object.keys(mndSet).length;
    var aansl=sa.y/12*nMnd,vast=st.vr*nMnd,kwC=50*st.kc*nMnd;
    var kwM=Object.keys(mPA).reduce(function(s,mn){return s+mPA[mn]*st.km;},0);
    var dubbel=dn*st.dn+dl*st.dl;
    eq(g.totaal,aansl+vast+kwC+kwM+dubbel,'totaal netkosten');
    eq(g.nMnd,nMnd,'maanden');
  });

  // --- huidige contractkosten ------------------------------------------------
  test('calculateCurrentContractCosts: vast contract',function(){
    var comp={priceA:0.30,priceT:0.05}; // legacy -> type 'vast'
    var data=[{ts:'2024-01-01T10:00',kw:100},{ts:'2024-01-01T10:15',kw:-40}];
    var r=calculateCurrentContractCosts(comp,data,[],{includeGridCosts:false});
    eq(r.type==='vast'?1:0,1,'type vast');
    eq(r.marktKostenAfname,25*0.30,'markt afname');
    eq(r.opbrengstTeruglever,10*0.05,'teruglever');
    eq(r.energiebelasting,25*0.1228,'EB');
    var sub=25*0.30-10*0.05+0+0+25*0.1228+0;
    eq(r.subtotaalExclBtw,sub,'subtotaal');
    eq(r.btw,sub*0.21,'btw'); eq(r.totaal,sub*1.21,'totaal');
  });
  test('calculateCurrentContractCosts: dynamisch + negatieve EPEX',function(){
    var comp={contract:{type:'dynamisch',dynOpslagAfname:0.02,dynAfslagTeruglever:0.01,
      energiebelastingToepassen:false,btwToepassen:false}};
    var data=[{ts:'2024-01-01T10:00',kw:100}];          // afname 25 kWh
    var prices=[{ts:'2024-01-01T10:00',price:-0.05}];     // negatieve marktprijs
    var r=calculateCurrentContractCosts(comp,data,prices,{includeGridCosts:false});
    eq(r.marktKostenAfname,25*(-0.05+0.02),'negatieve markt'); // = -0.75
    eq(r.negativePriceCount,1,'negatief geteld');
    eq(r.missingPriceCount,0,'geen ontbrekende');
  });
  test('calculateCurrentContractCosts: ontbrekende prijzen gemarkeerd',function(){
    var comp={contract:{type:'dynamisch',energiebelastingToepassen:false,btwToepassen:false}};
    var data=[{ts:'2024-01-01T10:00',kw:100},{ts:'2024-01-01T10:15',kw:80}];
    var prices=[{ts:'2024-01-01T10:00',price:0.10}]; // tweede kwartier ontbreekt
    var r=calculateCurrentContractCosts(comp,data,prices,{includeGridCosts:false});
    eq(r.missingPriceCount,1,'1 ontbrekend kwartier');
    eq(r.marktKostenAfname,25*0.10,'alleen geprijsd kwartier'); // tweede overgeslagen
  });
  test('calculateCurrentContractCosts: hybride blend',function(){
    var comp={contract:{type:'hybride',blendFactor:0.5,dynOpslagAfname:0.02,vasteAfnamePrijs:0.30,
      energiebelastingToepassen:false,btwToepassen:false}};
    var data=[{ts:'2024-01-01T10:00',kw:100}];
    var prices=[{ts:'2024-01-01T10:00',price:0.10}];
    var r=calculateCurrentContractCosts(comp,data,prices,{includeGridCosts:false});
    eq(r.marktKostenAfname,25*(0.5*(0.10+0.02)+0.5*0.30),'hybride afname'); // 25*0.21
  });
  test('calculateCurrentContractCosts: handmatige factuurbenchmark',function(){
    var comp={contract:{type:'benchmark',benchmarkFactuur:12000}};
    var data=[{ts:'2024-01-01T10:00',kw:100}]; // 1 maand
    var r=calculateCurrentContractCosts(comp,data,[],{});
    eq(r.totaal,12000/12,'benchmark per maand');
  });

  // --- interne allocatie -----------------------------------------------------
  test('allocateInternalEnergy: interne afname == interne levering',function(){
    var perKw=[[-80,-80],[40,120]]; var sources=['zon','none'];
    var a=allocateInternalEnergy(perKw,sources);
    eq(a.totMatchedKwh,30,'totaal verrekend'); // t0:10 + t1:20
    var sold=a.members.reduce(function(s,m){return s+m.intSoldKwh;},0);
    var bought=a.members.reduce(function(s,m){return s+m.intBoughtKwh;},0);
    eq(sold,bought,'conservatie'); eq(sold,30,'som intern');
    // conservatie per kwartier
    a.perQuarter.forEach(function(q){eq(q.matched,Math.min(q.totProd,q.totDem),'kwartier matched');});
  });

  // --- platformverrekening ---------------------------------------------------
  test('calculatePlatformSettlement: balans + bekende euro',function(){
    var perKw=[[-80,-80],[40,120]]; var ts=['2024-01-01T10:00','2024-01-01T10:15'];
    var sources=['zon','none'];
    var prices=[{ts:ts[0],price:0.20},{ts:ts[1],price:0.20}];
    var r=calculatePlatformSettlement(perKw,ts,sources,prices,{zon:0.08},
      {leveranciersOpslag:0.10,terugleverAfslag:0.04,fee:0});
    assert(r.internalBalanceOk,'interne balans');
    eq(r.totMatchedKwh,30,'matched');
    eq(r.totNet,-1.4,'netto totaal'); // m0 +4.0, m1 -5.4
    eq(r.members[0].net,4.0,'producent net'); eq(r.members[1].net,-5.4,'verbruiker net');
  });

  // --- jaarafrekening --------------------------------------------------------
  test('calculateAnnualStatement: regels tellen op tot totaal',function(){
    var comp={priceA:0.30,priceT:0.05,stedinA:'LS',stedinT:'LS',gtvA:50,name:'Test BV'};
    var data=[{ts:'2024-01-01T10:00',kw:100},{ts:'2024-01-01T10:15',kw:-40}];
    var st=calculateAnnualStatement(comp,data,[],{});
    var somRegels=st.regels.reduce(function(s,r){return s+r.bedrag;},0); // incl. btw-regel
    eq(somRegels,st.totaal,'regels == totaal');
    eq(st.subtotaalExclBtw+st.btw,st.totaal,'subtotaal+btw');
  });

  // ===== Fase 2: inhoudelijke uitwerking platform ============================

  // --- energiebelasting grondslag-modi ---------------------------------------
  test('EB grondslag externeLevering',function(){
    eq(calculateEnergyTax(0,0,{grondslag:'externeLevering',externeAfnameKwh:5000}).netto,5000*0.1228);
  });
  test('EB grondslag netto',function(){eq(calculateEnergyTax(10000,4000,{grondslag:'netto'}).netto,6000*0.1228);});
  test('EB grondslag bruto (default)',function(){eq(calculateEnergyTax(5000,9999,{}).netto,5000*0.1228);});
  test('EB jaarstaffel 2025',function(){eq(calculateEnergyTax(5000,0,{jaar:2025}).netto,5000*0.1316);});
  test('EB waarschuwing aanwezig',function(){assert(/juridische leveringsstructuur/.test(calculateEnergyTax(1,0,{}).waarschuwing));});

  // --- btw: geen dubbeltelling -----------------------------------------------
  test('calculateBtw: plichtig vs. vrijgesteld',function(){
    var r=calculateBtw({energie:{bedrag:100,btwPlichtig:true},vrij:{bedrag:50,btwPlichtig:false}},{pct:0.21});
    eq(r.grondslag,100,'grondslag'); eq(r.btw,21,'btw'); eq(r.perComponent.vrij.btw,0,'vrij geen btw');
  });
  test('calculateBtw: getal-shorthand',function(){eq(calculateBtw({a:100,b:100},{pct:0.21}).btw,42);});

  // --- netkosten: overschrijding + collectief --------------------------------
  test('calculateGridCosts: overschrijdingskosten',function(){
    var comp={stedinA:'none',stedinT:'none',gtvA:50,gecontracteerdVermogen:50};
    var data=[{ts:'2024-03-01T10:00',kw:80}];
    var g0=calculateGridCosts(comp,data,{overschrijdingsTarief:0});
    var g2=calculateGridCosts(comp,data,{overschrijdingsTarief:2});
    eq(g0.overschrijdingskosten,0); eq(g2.overschrijdingskosten,(80-50)*2);
    eq(g2.totaal-g0.totaal,60,'telt mee in totaal'); eq(g2.maandpiekAfname[0].piekKw,80);
  });
  test('compareGridCostsIndividualVsCollective: collectief < individueel',function(){
    var comps=[{stedinA:'LS',stedinT:'TrafoMSLS',gtvA:100},{stedinA:'LS',stedinT:'TrafoMSLS',gtvA:100}];
    var r=compareGridCostsIndividualVsCollective(comps,[[100,50],[50,100]],['2024-01-01T10:00','2024-01-01T10:15'],
      {stedinA:'LS',stedinT:'TrafoMSLS',gtvA:150,gecontracteerdVermogen:150},{});
    assert(r.collectief<r.individueel,'collectief goedkoper'); assert(r.besparing>0,'besparing>0');
  });

  // --- settlePlatform: volledige per-kwartier verrekening ---------------------
  function basisInput(extra){
    var ts=['2024-01-01T10:00','2024-01-01T10:15'];
    var base={
      members:[{id:'p',name:'Prod',source:'zon',kw:[-80,-80]},{id:'v',name:'Verbr',source:'none',kw:[40,120]}],
      ts:ts,priceSeries:[{ts:ts[0],price:0.20},{ts:ts[1],price:0.20}],
      internalPrices:{zon:0.08},
      platform:{leveranciersOpslag:0.10,terugleverAfslag:0.04,platformkosten:0,onbalansOpslag:0},
      eb:{toepassen:true,grondslag:'externeLevering'},btw:{toepassen:true,pct:0.21},net:{toepassen:false}
    };
    if(extra)for(var k in extra)base[k]=extra[k];
    return base;
  }
  function vCheck(r,naam){return r.validations.checks.filter(function(c){return c.check.indexOf(naam)>-1;})[0];}

  test('settlePlatform: alle componenten per bedrijf',function(){
    var r=settlePlatform(basisInput());
    var p,v; r.perCompany.forEach(function(c){if(c.id==='p')p=c;if(c.id==='v')v=c;});
    eq(p.productieKwh,40);eq(p.interneLeveringKwh,30);eq(p.externeVerkoopKwh,10);
    eq(p.eurInterneHandel,-2.4);eq(p.eurExterneVerkoop,2.0);eq(p.eurTerugleverafslag,0.4);
    eq(p.energiebelasting,0);eq(p.subtotaalExclBtw,-4.0);eq(p.totaalbedrag,-4.84);
    eq(v.verbruikKwh,40);eq(v.interneAfnameKwh,30);eq(v.externeInkoopKwh,10);
    eq(v.eurInterneHandel,2.4);eq(v.eurExterneInkoop,2.0);eq(v.eurLeveranciersopslag,1.0);
    eq(v.energiebelasting,10*0.1228);
    var sub=2.4+2.0+1.0+10*0.1228; eq(v.subtotaalExclBtw,sub);eq(v.btw,sub*0.21);eq(v.totaalbedrag,sub*1.21);
  });
  test('settlePlatform: interne balans = pass',function(){
    var r=settlePlatform(basisInput());
    eq(r.platform.interneAfnameKwh,r.platform.interneLeveringKwh); eq(r.platform.interneAfnameKwh,30);
    assert(vCheck(r,'Interne afname').status==='pass');
  });
  test('settlePlatform: energiebelasting reconcilieert',function(){
    var r=settlePlatform(basisInput());
    eq(r.meta.ebKwartierSom,r.meta.ebPeriodeBelasting); assert(vCheck(r,'Energiebelasting reconcilieert').status==='pass');
  });
  test('settlePlatform: btw niet dubbel',function(){assert(vCheck(settlePlatform(basisInput()),'Btw niet dubbel').status==='pass');});
  test('settlePlatform: kwartiermatrix reconcilieert',function(){
    var r=settlePlatform(basisInput({keepQuarterMatrix:true}));
    assert(r.perQuarter&&r.perQuarter.length===4,'4 matrixregels');
    var qv={}; r.perQuarter.forEach(function(x){qv[x.member]=(qv[x.member]||0)+x.verbruikKwh;});
    r.perCompany.forEach(function(c){eq(qv[c.id]||0,c.verbruikKwh,'kwartier→jaar '+c.id);});
    assert(vCheck(r,'kwartier↔maand↔jaar').status==='pass');
  });
  test('settlePlatform: maand→jaar reconcilieert',function(){
    var r=settlePlatform(basisInput());
    r.perCompany.forEach(function(c){
      var mv=c.perMonth.reduce(function(s,m){return s+m.verbruikKwh;},0); eq(mv,c.verbruikKwh,'maand '+c.id);
    });
  });
  test('settlePlatform: negatieve EPEX → info',function(){
    var inp=basisInput(); inp.priceSeries=[{ts:inp.ts[0],price:-0.05},{ts:inp.ts[1],price:0.20}];
    var r=settlePlatform(inp); assert(r.meta.negativePriceCount>=1); assert(vCheck(r,'Negatieve EPEX').status==='info');
  });
  test('settlePlatform: ontbrekende prijs → warn',function(){
    var inp=basisInput(); inp.priceSeries=[{ts:inp.ts[0],price:0.20}];
    var r=settlePlatform(inp); eq(r.meta.missingPriceCount,1); assert(vCheck(r,'Prijsdata-dekking').status==='warn');
  });
  test('settlePlatform: timestamp-mismatch gedetecteerd',function(){
    var inp=basisInput(); inp.priceSeries=[];
    var r=settlePlatform(inp); eq(r.meta.missingPriceCount,r.meta.tsTotaal); assert(vCheck(r,'Timestamp-dekking').status!=='pass');
  });

  // ===== Financiële jaarrekening =============================================

  test('distributeBenefit: gelijk / volume / inbreng / geen',function(){
    eq(distributeBenefit([{id:'a',eigenDelta:10},{id:'b',eigenDelta:90}],100,'gelijk').perCompany[0].aandeel,50);
    var v=distributeBenefit([{id:'a',afnameKwh:30},{id:'b',afnameKwh:10}],100,'volume');
    eq(v.perCompany[0].aandeel,75); eq(v.perCompany[1].aandeel,25);
    eq(distributeBenefit([{id:'a',productieKwh:0},{id:'b',productieKwh:40}],100,'inbreng').perCompany[1].aandeel,100);
    var g=distributeBenefit([{id:'a',eigenDelta:12},{id:'b',eigenDelta:8}],20,'geen');
    eq(g.perCompany[0].aandeel,12); eq(g.perCompany[1].aandeel,8);
    eq(distributeBenefit([{id:'a',afnameKwh:0},{id:'b',afnameKwh:0}],100,'volume').perCompany[0].aandeel,50); // fallback
  });

  var FIN_A={internalPrices:{zon:0.08},leveranciersOpslag:0.10,terugleverAfslag:0.04,platformkosten:0,onbalansOpslag:0,
    btwPct:0.21,ebGrondslag:'externeLevering',heffingskortingPerLid:0,verdeelsleutel:'volume',netToepassen:true,keepQuarterMatrix:true};
  function finMembers(){
    var ts=['2024-01-01T10:00','2024-01-01T10:15'],comp={priceA:0.30,priceT:0.05,stedinA:'none',stedinT:'none',gtvA:100};
    return [{id:'p',name:'Prod',source:'zon',company:comp,data:[{ts:ts[0],kw:-80},{ts:ts[1],kw:-80}]},
            {id:'v',name:'Verbr',source:'none',company:comp,data:[{ts:ts[0],kw:40},{ts:ts[1],kw:120}]}];
  }
  var FIN_PRICES=[{ts:'2024-01-01T10:00',price:0.20},{ts:'2024-01-01T10:15',price:0.20}];

  test('buildAnnualComparison: huidig vs. platform per bedrijf',function(){
    var r=buildAnnualComparison(finMembers(),FIN_PRICES,FIN_A);
    var P,V; r.perCompany.forEach(function(c){if(c.id==='p')P=c;if(c.id==='v')V=c;});
    eq(P.nettoHuidig,-2.42,'P huidig'); eq(P.nettoPlatform,-4.84,'P platform'); eq(P.verschil,2.42,'P verschil');
    var vSub=12.0+40*0.1228; eq(V.nettoHuidig,vSub*1.21,'V huidig');
    eq(V.gemInkoopHuidig,0.30,'gem inkoop huidig'); eq(V.gemInkoopPlatform,5.4/40,'gem inkoop platform');
  });
  test('buildAnnualComparison: geconsolideerd + verdeling',function(){
    var r=buildAnnualComparison(finMembers(),FIN_PRICES,FIN_A);
    eq(r.consolidated.totaalVoordeel,r.perCompany.reduce(function(s,c){return s+c.verschil;},0),'totaalVoordeel');
    eq(r.consolidated.internMatchingKwh,30,'matching');
    eq(r.voordeelverdeling.perCompany.reduce(function(s,x){return s+x.aandeel;},0),r.consolidated.totaalVoordeel,'verdeling som');
  });
  test('buildAnnualComparison: maand→jaar + kwartiermatrix',function(){
    var r=buildAnnualComparison(finMembers(),FIN_PRICES,FIN_A);
    eq(r.perMonth.reduce(function(s,m){return s+m.verbruikKwh;},0),r.consolidated.afnameKwh,'maand verbruik');
    assert(r.perQuarter&&r.perQuarter.length===4,'kwartiermatrix');
  });
  test('buildAnnualComparison: ontbrekende EPEX → fallback',function(){
    var A2={}; for(var k in FIN_A)A2[k]=FIN_A[k]; A2.fallbackPrice=0.15;
    var r=buildAnnualComparison(finMembers(),[],A2);
    eq(r.meta.missingPriceCount,0,'fallback dekt alles'); assert(isFinite(r.consolidated.totaalVoordeel));
  });

  // --- weergave --------------------------------------------------------------
  var nPass=results.filter(function(r){return r.ok;}).length;
  var rows=document.getElementById('rows');
  rows.innerHTML=results.map(function(r){
    return '<tr class="'+(r.ok?'pass':'fail')+'"><td>'+(r.ok?'PASS':'FAIL')+'</td><td>'+r.name+'</td><td class="msg">'+(r.msg||'')+'</td></tr>';
  }).join('');
  var sum=document.getElementById('sum');
  var allOk=nPass===results.length;
  sum.className=allOk?'ok':'bad';
  sum.textContent=nPass+' / '+results.length+' tests geslaagd'+(allOk?' ✓':' — er zijn fouten');
})();
</script>
</body>
</html>
